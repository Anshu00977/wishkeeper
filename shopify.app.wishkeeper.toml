# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "820be92bcc75aaf713759e752ad75226"
name = "WishKeeper"
application_url = "https://wishkeeper.kaswebtechsolutions.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,unauthenticated_read_product_listings,write_metaobject_definitions,write_metaobjects,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://wishkeeper.kaswebtechsolutions.com/auth/callback" ]

[app_proxy]
url = "https://wishkeeper.kaswebtechsolutions.com/apps/wishlist"
subpath = "wishlist"
prefix = "apps"
